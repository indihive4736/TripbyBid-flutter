name: tripbybid
description: "TripByBid — reverse-auction travel marketplace (Flutter client)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cashfree_pg_sdk: ^2.4.0+52
  flutter_secure_storage: ^10.3.4
  get_it: ^9.3.0
  go_router: ^17.2.3
  http: ^1.6.0
  intl: ^0.20.3
  material_symbols_icons: ^4.2960.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  path: ^1.9.1

flutter:
  uses-material-design: true

  # Airports, train stations and cities for the request form (copied from
  # the web client's datasets).
  assets:
    - assets/data/

  # Bundled from Google Fonts (SIL Open Font License) so the app never
  # fetches fonts at runtime.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-400.ttf
        - asset: assets/fonts/InstrumentSerif-400Italic.ttf
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
